<!doctype html>
<html lang="en" dir="ltr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071014"><title>EddyWEB | Staff</title><link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"></head>
<body><div class="grid"></div>
<main class="info-page">
<a class="info-back" href="index.html">← Back to EddyWEB</a>
<section class="info-hero"><div class="badge" id="staff-badge">SERVER STAFF</div><h1 id="staff-title">Our Staff</h1><p id="staff-intro">Meet the people who help manage and support the EddyWEB Minecraft community.</p><div class="page-lang"><button class="btn" id="staff-lang">עברית</button></div></section>
<section class="info-card"><h2 id="staff-heading">Staff Team</h2><div id="staff-list" class="staff-list"><div class="staff-empty" id="staff-loading">Loading staff...</div></div></section>
</main>
<script>
const DISCORD_API='https://eddy-bot-lyvo.onrender.com/api/discord';
const MINECRAFT_API='/api/minecraft/staff';
let lang=localStorage.getItem('eddy-language')||'en';
const tr={en:{back:'← Back to EddyWEB',badge:'SERVER STAFF',title:'Our Staff',intro:'Meet the people who help manage and support the EddyWEB community.',heading:'Staff Team',loading:'Loading staff...',failed:'Unable to load staff information.',discord:'Discord Staff',minecraft:'Minecraft Staff',roles:{team:'Team',developers:'Developers',helpers:'Helpers',moderators:'Moderators'},empty:'No staff members found.',switch:'עברית'},
he:{back:'→ חזרה ל-EddyWEB',badge:'צוות השרת',title:'צוות השרת',intro:'הכירו את האנשים שעוזרים לנהל ולתמוך בקהילת EddyWEB.',heading:'צוות השרת',loading:'טוען את הצוות...',failed:'לא ניתן לטעון את מידע הצוות.',discord:'צוות Discord',minecraft:'צוות Minecraft',roles:{team:'צוות',developers:'מתכנתים',helpers:'הלפרים',moderators:'מודרטורים'},empty:'לא נמצאו אנשי צוות.',switch:'English'}};
function safe(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function memberCard(name,role,avatar,status){return '<div class="staff-member" style="display:flex;align-items:center;gap:12px">'+(avatar?'<img src="'+safe(avatar)+'" alt="" width="42" height="42" style="border-radius:50%;object-fit:cover">':'')+'<div style="flex:1;min-width:0"><strong>'+safe(name)+'</strong>'+(status?'<div class="staff-role">'+safe(status)+'</div>':'')+'</div><span class="staff-role">'+safe(role)+'</span></div>';}
function section(title,content){return '<section class="staff-source"><h3>'+safe(title)+'</h3>'+(content||'<div class="staff-empty">'+tr[lang].empty+'</div>')+'</section>';}
function apply(){const x=tr[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==='he'?'rtl':'ltr';document.querySelector('.info-back').textContent=x.back;document.getElementById('staff-badge').textContent=x.badge;document.getElementById('staff-title').textContent=x.title;document.getElementById('staff-intro').textContent=x.intro;document.getElementById('staff-heading').textContent=x.heading;document.getElementById('staff-lang').textContent=x.switch;load();}
async function load(){const el=document.getElementById('staff-list'),x=tr[lang];el.innerHTML='<div class="staff-empty">'+x.loading+'</div>';try{const [dr,mr]=await Promise.all([fetch(DISCORD_API,{cache:'no-store'}),fetch(MINECRAFT_API,{cache:'no-store'})]);if(!dr.ok||!mr.ok)throw new Error('Staff API unavailable');const [d,m]=await Promise.all([dr.json(),mr.json()]);if(!d.ok||!m.success)throw new Error('Invalid staff API response');const roles=d.staff?.roles||{};let discordHtml='';Object.keys(x.roles).forEach(k=>{const role=roles[k];if(!role||!Array.isArray(role.members))return;const cards=role.members.map(person=>memberCard(person.displayName||person.username||person.name,x.roles[k],person.avatar,person.online?'Online':'')).join('');if(cards)discordHtml+=cards;});const minecraftHtml=(m.members||[]).map(person=>memberCard(person.username,person.rank||'staff','', '')).join('');el.innerHTML=section(x.discord,discordHtml)+section(x.minecraft,minecraftHtml);}catch(e){console.error('Staff page load error:',e);el.innerHTML='<div class="staff-empty">'+x.failed+'</div>';}}
document.getElementById('staff-lang').onclick=()=>{lang=lang==='en'?'he':'en';localStorage.setItem('eddy-language',lang);apply()};apply();</script><script src="theme.js"></script><script src="animations.js"></script>
  <script src="account-nav.js"></script></body></html>
