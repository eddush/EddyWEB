<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071014">
  <title>העמוד לא נמצא | EddyWEB</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="stylesheet" href="/style.css">
  <style>
    body{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
    .error-card{width:min(100%,620px);padding:42px 28px;border:1px solid #ffffff25;border-radius:22px;background:#071014c9;backdrop-filter:blur(14px);box-shadow:0 20px 70px #0005}
    .error-logo{width:88px;height:88px;object-fit:contain;margin:0 auto 22px;image-rendering:auto}
    .error-code{font-size:clamp(64px,15vw,112px);line-height:1;margin:0;color:#65d9ff;font-weight:800}
    h1{margin:18px 0 12px}.error-card p{opacity:.82;line-height:1.7}
    .home-link{display:inline-flex;margin-top:18px;padding:12px 22px;border-radius:12px;text-decoration:none;background:#35bde8;color:#041017;font-weight:800}
  </style>
</head>
<body>
  <main class="error-card">
    <img class="error-logo" src="/logo.png" alt="EddyWEB logo">
    <p class="error-code">404</p>
    <h1>העמוד לא נמצא</h1>
    <p>נראה שהקישור שפתחת לא קיים או שהעמוד הועבר למקום אחר.</p>
    <a class="home-link" href="/">חזרה לעמוד הראשי</a>
  </main>
</body>
</html>
