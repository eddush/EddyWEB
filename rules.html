function headingIcon(title,icon){return '<i class="fa-solid '+icon+'" aria-hidden="true"></i> '+title}
function renderList(items){return items.map((item)=>'<li>'+item+'</li>').join('')}
function applyRulesLanguage(){

document.documentElement.lang=lang;document.documentElement.dir=he?'rtl':'ltr';
document.title='EddyWEB | '+x.title;
document.getElementById('rules-back').textContent=x.back;
document.getElementById('rules-badge').textContent=x.badge;
document.getElementById('rules-title').textContent=x.title;
document.getElementById('rules-intro').textContent=x.intro;
document.getElementById('rules-lang').textContent=x.switch;
const groups=x.groups.map(([title,items])=>'<section class="rule-group"><h2>'+headingIcon(title,ruleIcons[title]||'fa-circle-info')+'</h2><ol>'+renderList(items)+'</ol></section>').join('');
const useful='<section class="rule-group"><h2>'+headingIcon(x.usefulTitle,'fa-terminal')+'</h2><ul>'+renderList(x.useful)+'</ul></section>';
const links='<section class="rule-group"><h2>'+headingIcon(x.linksTitle,'fa-link')+'</h2><div class="rules-links">'+x.links.map(([label,url])=>'<a href="'+url+'" target="_blank" rel="noopener noreferrer">'+label+': '+url+'</a>').join('')+'</div></section>';
document.getElementById('rules-list').innerHTML=groups+useful+links;
}

});
