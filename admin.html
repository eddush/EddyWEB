<!doctype html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>EddyWEB | ניהול עדכונים וסקינים</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container {
            max-width: 850px;
            margin: 30px auto;
            padding: 20px;
            position: relative;
            z-index: 2;
        }

        .login-box,
        .news-editor {
            background: #0d181d;
            border: 1px solid #31e7ca44;
            padding: 25px;
            border-radius: 12px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-weight: bold;
            color: #5fffe4;
            font-size: 13px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 8px;
            background: #060b0e;
            border: 1px solid #ffffff20;
            color: #fff;
            border-radius: 6px;
        }

        .item-card {
            background: #121d22;
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-right: 4px solid #b965ff;
        }

        .row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .skin-preview-box {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #060b0e;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .skin-preview-box img {
            height: 70px;
            object-fit: contain;
        }

        .btn-danger {
            background: #ff4757;
            color: #fff;
            border: 0;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div class="grid"></div>
    <div class="admin-container">
        <div id="login-section" class="login-box">
            <h3>התחברות למערכת הניהול</h3>
            <div class="form-group">
                <input type="password" id="admin-pass" placeholder="הכנס סיסמה...">
            </div>
            <button class="btn primary" onclick="login()">התחבר</button>
            <p id="login-error" style="color: #ff6b8a;"></p>
        </div>

        <div id="editor-section" class="news-editor hidden">
            <h3>יצירת עדכון/מאמר חדש</h3>
            <div id="news-list"></div>
            <button class="btn" onclick="addNewsItem()">+ הוסף עדכון חדש</button>
            <hr style="border-color: #ffffff10; margin: 20px 0;">
            <button class="btn primary" onclick="saveNewsToServer()">שמור שינויים בשרת</button>
            <p id="save-status"></p>
        </div>
    </div>

    <script>
        let authToken = '';
        let newsItems = [];

        async function login() {
            const password = document.getElementById('admin-pass').value;
            const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password }) });
            const data = await res.json();
            if (res.ok && data.success) {
                authToken = password;
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('editor-section').classList.remove('hidden');
                loadNews();
            } else { document.getElementById('login-error').textContent = 'סיסמה שגויה'; }
        }

        async function loadNews() {
            const res = await fetch('news.json');
            newsItems = await res.json();
            render();
        }

        function render() {
            const list = document.getElementById('news-list');
            list.innerHTML = newsItems.map((item, i) => `
        <div class="item-card">
          <div class="row-2">
            <div class="form-group">
              <label>שם כותב המאמר (מיינקרפט Username):</label>
              <input type="text" value="${item.author || 'Steve'}" oninput="updateAuthor(${i}, this.value)">
            </div>
            <div class="skin-preview-box">
              <img id="skin-preview-${i}" src="https://mc-heads.net/body/${item.author || 'Steve'}/right" alt="Skin Preview">
              <span style="font-size:12px; color:#8fa0a3;">תצוגת סקין בזמן אמת</span>
            </div>
          </div>

          <div class="row-2">
            <div class="form-group"><label>כותרת (עברית):</label><input type="text" value="${item.title_he || ''}" onchange="updateItem(${i},'title_he',this.value)"></div>
            <div class="form-group"><label>כותרת (אנגלית):</label><input type="text" value="${item.title_en || ''}" onchange="updateItem(${i},'title_en',this.value)"></div>
          </div>

          <div class="row-2">
            <div class="form-group"><label>תיאור קצר (עברית):</label><textarea onchange="updateItem(${i},'text_he',this.value)">${item.text_he || ''}</textarea></div>
            <div class="form-group"><label>תיאור קצר (אנגלית):</label><textarea onchange="updateItem(${i},'text_en',this.value)">${item.text_en || ''}</textarea></div>
          </div>

          <div class="form-group">
            <label>תוכן המאמר המלא / Changelog (HTML/פסוקים):</label>
            <textarea rows="4" placeholder="<h3>שינויים בגרסה:</h3><ul><li>תוקן באג</li></ul>" onchange="updateItem(${i},'content_he',this.value)">${item.content_he || ''}</textarea>
          </div>

          <button class="btn-danger" onclick="deleteItem(${i})">מחק</button>
        </div>
      `).join('');
        }

        function updateItem(i, k, v) { newsItems[i][k] = v; }
        function updateAuthor(i, name) {
            newsItems[i].author = name;
            document.getElementById(`skin-preview-${i}`).src = `https://mc-heads.net/body/${name}/right`;
        }
        function deleteItem(i) { newsItems.splice(i, 1); render(); }
        function addNewsItem() {
            const id = 'post-' + Date.now();
            newsItems.push({ id, author: 'Steve', badge_he: 'עדכון', badge_en: 'UPDATE', title_he: '', title_en: '', text_he: '', text_en: '', content_he: '', content_en: '', url: `article.html?id=${id}` });
            render();
        }

        async function saveNewsToServer() {
            const status = document.getElementById('save-status');
            status.textContent = 'שומר...';
            const res = await fetch('/api/save-news', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: authToken, news: newsItems }) });
            const data = await res.json();
            status.textContent = data.success ? '✓ נשמר בהצלחה!' : 'שגיאה בשמירה';
        }
    </script>
</body>

</html>
