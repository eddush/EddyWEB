<!doctype html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EddyWEB | ניהול עדכונים ומאמרים</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <style>
        .admin-container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            position: relative;
            z-index: 2;
        }

        .login-box,
        .news-editor {
            background: #0d181d;
            border: 1px solid #31e7ca44;
            padding: 25px;
            border-radius: 12px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #5fffe4;
            font-size: 13px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            background: #060b0e;
            border: 1px solid #ffffff20;
            color: #fff;
            border-radius: 6px;
            font-family: inherit;
        }

        .item-card {
            background: #121d22;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-right: 4px solid #b965ff;
        }

        .row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .skin-preview-box {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #060b0e;
            padding: 5px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .btn-danger {
            background: #ff4757;
            color: #fff;
            border: 0;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
        }

        .hidden {
            display: none;
        }

        .ql-toolbar {
            background: #e9ffff;
            border-radius: 6px 6px 0 0;
        }

        .ql-container {
            background: #fff;
            color: #000;
            border-radius: 0 0 6px 6px;
            min-height: 200px;
            font-family: 'Rubik', sans-serif;
        }

        .editor-wrapper {
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div class="grid"></div>
    <div class="admin-container">
        <div id="login-section" class="login-box">
            <h3>התחברות למערכת</h3>
            <div class="form-group">
                <input type="password" id="admin-pass" placeholder="הכנס סיסמה...">
            </div>
            <button class="btn primary" onclick="login()">התחבר</button>
            <p id="login-error" style="color: #ff6b8a; margin-top: 10px;"></p>
        </div>

        <div id="editor-section" class="news-editor hidden">
            <h3>יצירת מאמר Changelog</h3>
            <div id="news-list"></div>
            <button class="btn" onclick="addNewsItem()">+ צור מאמר חדש</button>
            <hr style="border-color: #ffffff10; margin: 20px 0;">
            <button class="btn primary" onclick="saveNewsToServer()" style="font-size: 16px; padding: 12px 24px;">שמור
                מאמרים</button>
            <p id="save-status" style="margin-top: 10px; font-weight: bold;"></p>
        </div>
    </div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script src="https://unpkg.com/skinview3d@3.0.0/dist/skinview3d.bundle.js"></script>
    <script>
        let authToken = '';
        let newsItems = [];
        let editors = {};
        let skinViewers = {};

        async function login() {
            const password = document.getElementById('admin-pass').value;
            const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password }) });
            const data = await res.json();
            if (res.ok && data.success) {
                authToken = password;
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('editor-section').classList.remove('hidden');
                loadNews();
            } else {
                document.getElementById('login-error').textContent = 'סיסמה שגויה';
            }
        }

        async function loadNews() {
            const res = await fetch('news.json');
            newsItems = await res.json();
            render();
        }

        function render() {
            const list = document.getElementById('news-list');
            list.innerHTML = '';
            editors = {};
            skinViewers = {};

            newsItems.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = 'item-card';
                div.innerHTML = `
          <div class="row-2">
            <div class="form-group">
              <label>שם הכותב במיינקרפט (ייוצר דגם 3D):</label>
              <input type="text" value="${item.author || 'Steve'}" oninput="updateAuthor(${i}, this.value)">
            </div>
            <div class="skin-preview-box">
              <canvas id="skin-canvas-${i}" style="width: 100px; height: 120px;"></canvas>
            </div>
          </div>

          <div class="row-2">
            <div class="form-group"><label>כותרת מאמר (עברית):</label><input type="text" value="${item.title_he || ''}" onchange="updateItem(${i},'title_he',this.value)"></div>
            <div class="form-group"><label>כותרת מאמר (אנגלית):</label><input type="text" value="${item.title_en || ''}" onchange="updateItem(${i},'title_en',this.value)"></div>
          </div>

          <div class="row-2">
            <div class="form-group"><label>תגית (עברית):</label><input type="text" value="${item.badge_he || 'עדכון'}" onchange="updateItem(${i},'badge_he',this.value)"></div>
            <div class="form-group"><label>תגית (אנגלית):</label><input type="text" value="${item.badge_en || 'UPDATE'}" onchange="updateItem(${i},'badge_en',this.value)"></div>
          </div>

          <div class="row-2">
            <div class="form-group"><label>תיאור קצר לדף הבית (עברית):</label><textarea rows="2" onchange="updateItem(${i},'text_he',this.value)">${item.text_he || ''}</textarea></div>
            <div class="form-group"><label>תיאור קצר לדף הבית (אנגלית):</label><textarea rows="2" onchange="updateItem(${i},'text_en',this.value)">${item.text_en || ''}</textarea></div>
          </div>

          <div class="editor-wrapper">
            <label style="color:#5fffe4; font-weight:bold; margin-bottom:5px; display:block;">תוכן המאמר המלא (עברית):</label>
            <div id="editor-he-${i}"></div>
          </div>
          
          <div class="editor-wrapper">
            <label style="color:#5fffe4; font-weight:bold; margin-bottom:5px; display:block;">תוכן המאמר המלא (אנגלית):</label>
            <div id="editor-en-${i}"></div>
          </div>

          <button class="btn-danger" onclick="deleteItem(${i})">מחק מאמר</button>
        `;
                list.appendChild(div);

                // אתחול עורכי הטקסט
                const toolbarOptions = [['bold', 'italic', 'underline'], [{ 'header': [2, 3, false] }], [{ 'list': 'ordered' }, { 'list': 'bullet' }], ['clean']];
                const quillHe = new Quill(`#editor-he-${i}`, { theme: 'snow', modules: { toolbar: toolbarOptions } });
                quillHe.root.innerHTML = item.content_he || '';
                const quillEn = new Quill(`#editor-en-${i}`, { theme: 'snow', modules: { toolbar: toolbarOptions } });
                quillEn.root.innerHTML = item.content_en || '';
                editors[i] = { he: quillHe, en: quillEn };

                // אתחול מודל 3D של הסקין
                const viewer = new skinview3d.SkinViewer({
                    canvas: document.getElementById(`skin-canvas-${i}`),
                    width: 100,
                    height: 120,
                    skin: `https://mc-heads.net/skin/${encodeURIComponent(item.author || 'Steve')}`
                });
                viewer.fov = 70;
                viewer.zoom = 0.9;
                viewer.camera.position.x = -15;
                viewer.camera.position.y = 12;
                viewer.camera.position.z = 22;
                skinViewers[i] = viewer;
            });
        }

        function updateItem(i, k, v) { newsItems[i][k] = v; }

        function updateAuthor(i, name) {
            newsItems[i].author = name;
            if (skinViewers[i]) {
                skinViewers[i].loadSkin(`https://mc-heads.net/skin/${encodeURIComponent(name || 'Steve')}`);
            }
        }

        function deleteItem(i) {
            newsItems.splice(i, 1);
            render();
        }

        function addNewsItem() {
            const id = 'post-' + Date.now();
            newsItems.push({ id, author: 'Steve', badge_he: 'עדכון', badge_en: 'UPDATE', title_he: '', title_en: '', text_he: '', text_en: '', content_he: '', content_en: '', url: `article.html?id=${id}` });
            render();
        }

        async function saveNewsToServer() {
            const status = document.getElementById('save-status');
            status.textContent = 'שומר...';

            newsItems.forEach((item, i) => {
                item.content_he = editors[i].he.root.innerHTML;
                item.content_en = editors[i].en.root.innerHTML;
            });

            const res = await fetch('/api/save-news', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: authToken, news: newsItems })
            });
            const data = await res.json();

            if (data.success) {
                status.style.color = '#5fffe4';
                status.textContent = '✓ המאמרים נשמרו בהצלחה!';
            } else {
                status.style.color = '#ff6b8a';
                status.textContent = 'שגיאה בשמירה';
            }
        }
    </script>
</body>

</html>
