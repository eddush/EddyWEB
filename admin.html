<!doctype html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EddyWEB | ניהול עדכונים ומאמרים</title>
    <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <style>
        .admin-container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            position: relative;
            z-index: 2;
        }

        .login-box,
        .news-editor {
            background: #0d181d;
            border: 1px solid #31e7ca44;
            padding: 25px;
            border-radius: 12px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #5fffe4;
            font-size: 13px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            background: #060b0e;
            border: 1px solid #ffffff20;
            color: #fff;
            border-radius: 6px;
            font-family: inherit;
        }

        .item-card {
            background: #121d22;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-right: 4px solid #b965ff;
        }

        .row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .skin-preview-box {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #060b0e;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .skin-canvas-preview {
            width: 90px;
            height: 90px;
            image-rendering: pixelated;
        }

        .btn-danger {
            background: #ff4757;
            color: #fff;
            border: 0;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
        }

        .hidden {
            display: none;
        }

        .ql-toolbar {
            background: #e9ffff;
            border-radius: 6px 6px 0 0;
        }

        .ql-container {
            background: #fff;
            color: #000;
            border-radius: 0 0 6px 6px;
            min-height: 200px;
            font-family: 'Rubik', sans-serif;
        }

        .editor-wrapper {
            margin-bottom: 20px;
        }

        .ai-improve-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .btn-ai {
            background: linear-gradient(135deg, #31e7ca, #b965ff);
            color: #04110f;
            border: 0;
            box-shadow: 0 8px 24px #31e7ca22;
            font-weight: 800;
        }

        .btn-ai:hover {
            color: #04110f;
            box-shadow: 0 12px 30px #31e7ca44;
        }

        .ai-status {
            font-size: 13px;
            color: #93a8ab;
            min-height: 20px;
        }

        .ai-status.success {
            color: #5fffe4;
        }

        .ai-status.error {
            color: #ff6b8a;
        }

        .ai-loading {
            opacity: .7;
            pointer-events: none;
        }

    </style>
</head>

<body>
    <button id="admin-language-toggle" class="lang-btn" type="button" style="position:fixed;top:16px;left:16px;z-index:30">English</button>
    <div class="grid"></div>
    <div class="admin-container">
        <div id="login-section" class="login-box">
            <h3 id="admin-login-heading">כניסה למערכת הניהול</h3>
            <p id="admin-login-description">יש להתחבר לחשבון EddyWEB שמקושר לשחקן Minecraft עם הרשאת eddyweb.admin.</p>
            <a class="btn primary" id="admin-account-link" href="/account.html">התחברות לחשבון EddyWEB</a>
            <button class="btn" id="admin-login-button" type="button" onclick="login()">בדיקת הרשאה</button>
            <p id="login-error" style="color: #ff6b8a; margin-top: 10px;"></p>
        </div>

        <div id="editor-section" class="news-editor hidden">
            <h3 id="admin-editor-heading">יצירת מאמר Changelog</h3>
            <div id="news-list"></div>
            <button class="btn" id="admin-add-button" onclick="addNewsItem()">+ צור מאמר חדש</button>
            <hr style="border-color: #ffffff10; margin: 20px 0;">
            <button class="btn primary" id="admin-save-button" onclick="saveNewsToServer()" style="font-size: 16px; padding: 12px 24px;">שמור
                מאמרים</button>
            <p id="save-status" style="margin-top: 10px; font-weight: bold;"></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script>

        let adminLang = localStorage.getItem('eddy-language') || 'he';
        function applyAdminLanguage() {
            const he = adminLang === 'he';
            document.documentElement.lang = adminLang;
            document.documentElement.dir = he ? 'rtl' : 'ltr';
            document.title = he ? 'EddyWEB | ניהול עדכונים ומאמרים' : 'EddyWEB | News & Article Admin';
            document.getElementById('admin-language-toggle').textContent = he ? 'English' : 'עברית';
            document.getElementById('admin-login-heading').textContent = he ? 'כניסה למערכת הניהול' : 'Admin Panel Access';
            document.getElementById('admin-login-description').textContent = he ? 'יש להתחבר לחשבון EddyWEB שמקושר לשחקן Minecraft עם הרשאת eddyweb.admin.' : 'Sign in to the EddyWEB account linked to a Minecraft player with the eddyweb.admin permission.';
            document.getElementById('admin-account-link').textContent = he ? 'התחברות לחשבון EddyWEB' : 'Sign in to EddyWEB';
            document.getElementById('admin-login-button').textContent = he ? 'בדיקת הרשאה' : 'Check permission';
            document.getElementById('admin-editor-heading').textContent = he ? 'יצירת מאמר Changelog' : 'Create Changelog Article';
            document.getElementById('admin-add-button').textContent = he ? '+ צור מאמר חדש' : '+ Create Article';
            document.getElementById('admin-save-button').textContent = he ? 'שמור מאמרים' : 'Save Articles';
        }
        document.getElementById('admin-language-toggle').addEventListener('click', () => {
            adminLang = adminLang === 'he' ? 'en' : 'he';
            try { localStorage.setItem('eddy-language', adminLang); } catch (_) {}
            applyAdminLanguage();
        adminSupabase.auth.getSession().then(({ data }) => { if (data?.session) login(); });
        });

        const adminSupabase = window.supabase.createClient(
            'https://vnhgkatsfpjyqpdppqrf.supabase.co',
            'sb_publishable_N6amZaYaWj7AdF8wQAHpEA_Qd2TAyp6'
        );
        let authToken = '';
        let newsItems = [];
        let editors = {};

        function drawDropsAvatar(canvasId, username) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = false;

            const skin = new Image();
            skin.crossOrigin = "Anonymous";
            skin.src = `https://mc-heads.net/skin/${encodeURIComponent(username || 'Steve')}`;

            skin.onload = () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const scale = 12;
                const startX = 25;
                const startY = 20;

                ctx.drawImage(skin, 20, 20, 8, 12, startX + (3 * scale), startY + (7 * scale), 7 * scale, 4 * scale);
                ctx.drawImage(skin, 44, 20, 4, 12, startX + (1 * scale), startY + (7 * scale), 2 * scale, 4 * scale);
                ctx.drawImage(skin, 44, 20, 4, 12, startX + (9.5 * scale), startY + (7 * scale), 2 * scale, 4 * scale);
                ctx.drawImage(skin, 4, 28, 8, 4, startX + (3.5 * scale), startY + (10.5 * scale), 6 * scale, 1.5 * scale);

                ctx.drawImage(skin, 0, 8, 8, 8, startX, startY, 3 * scale, 8 * scale);
                ctx.drawImage(skin, 8, 8, 8, 8, startX + (3 * scale), startY, 8 * scale, 8 * scale);

                ctx.drawImage(skin, 32, 8, 8, 8, startX - (0.2 * scale), startY - (0.2 * scale), 3.2 * scale, 8.4 * scale);
                ctx.drawImage(skin, 40, 8, 8, 8, startX + (2.8 * scale), startY - (0.2 * scale), 8.4 * scale, 8.4 * scale);
            };
        }

        async function login() {
            const error = document.getElementById('login-error');
            error.textContent = adminLang === 'he' ? 'בודק חשבון והרשאות...' : 'Checking account and permissions...';
            const { data: sessionData } = await adminSupabase.auth.getSession();
            authToken = sessionData?.session?.access_token || '';
            if (!authToken) {
                error.textContent = adminLang === 'he' ? 'יש להתחבר תחילה לחשבון EddyWEB.' : 'Please sign in to your EddyWEB account first.';
                return;
            }
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + authToken, 'Content-Type': 'application/json' },
                body: JSON.stringify({})
            });
            const data = await res.json();
            if (res.ok && data.success) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('editor-section').classList.remove('hidden');
                loadNews();
            } else {
                authToken = '';
                error.textContent = data.message || (adminLang === 'he' ? 'אין הרשאה למערכת הניהול.' : 'You do not have admin permission.');
            }
        }

        async function loadNews() {
            const res = await fetch('/api/news', { cache: 'no-store' });
            newsItems = await res.json();
            render();
        }

        function render() {
            const list = document.getElementById('news-list');
            list.innerHTML = '';
            editors = {};

            newsItems.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = 'item-card';

                div.innerHTML = `
          <div class="row-2">
            <div class="form-group">
              <label>${adminLang === 'he' ? 'שם הכותב במיינקרפט (סגנון Drops):' : 'Minecraft author name (Drops style):'}</label>
              <input type="text" value="${item.author || 'Steve'}" oninput="updateAuthor(${i}, this.value)">
            </div>
            <div class="skin-preview-box">
              <canvas id="skin-preview-${i}" width="200" height="200" class="skin-canvas-preview"></canvas>
            </div>
          </div>

          <div class="row-2">
            <div class="form-group"><label>${adminLang === 'he' ? 'כותרת מאמר (עברית):' : 'Article title (Hebrew):'}</label><input type="text" value="${item.title_he || ''}" onchange="updateItem(${i},'title_he',this.value)"></div>
            <div class="form-group"><label>${adminLang === 'he' ? 'כותרת מאמר (אנגלית):' : 'Article title (English):'}</label><input type="text" value="${item.title_en || ''}" onchange="updateItem(${i},'title_en',this.value)"></div>
          </div>

          <div class="row-2">
            <div class="form-group"><label>${adminLang === 'he' ? 'תגית (עברית):' : 'Badge (Hebrew):'}</label><input type="text" value="${item.badge_he || 'עדכון'}" onchange="updateItem(${i},'badge_he',this.value)"></div>
            <div class="form-group"><label>${adminLang === 'he' ? 'תגית (אנגלית):' : 'Badge (English):'}</label><input type="text" value="${item.badge_en || 'UPDATE'}" onchange="updateItem(${i},'badge_en',this.value)"></div>
          </div>

          <div class="row-2">
            <div class="form-group"><label>${adminLang === 'he' ? 'תיאור קצר לדף הבית (עברית):' : 'Short homepage description (Hebrew):'}</label><textarea rows="2" onchange="updateItem(${i},'text_he',this.value)">${item.text_he || ''}</textarea></div>
            <div class="form-group"><label>${adminLang === 'he' ? 'תיאור קצר לדף הבית (אנגלית):' : 'Short homepage description (English):'}</label><textarea rows="2" onchange="updateItem(${i},'text_en',this.value)">${item.text_en || ''}</textarea></div>
          </div>

          <div class="editor-wrapper">
            <label style="color:#5fffe4; font-weight:bold; margin-bottom:5px; display:block;">${adminLang === 'he' ? 'תוכן המאמר המלא (עברית):' : 'Full article content (Hebrew):'}</label>
            <div id="editor-he-${i}"></div>
          </div>
          
          <div class="editor-wrapper">
            <label style="color:#5fffe4; font-weight:bold; margin-bottom:5px; display:block;">${adminLang === 'he' ? 'תוכן המאמר המלא (אנגלית):' : 'Full article content (English):'}</label>
            <div id="editor-en-${i}"></div>
          </div>

          <div class="ai-improve-row">
            <button class="btn btn-ai" type="button" onclick="improveArticle(${i})"><i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i> ${adminLang === 'he' ? 'שפר את המאמר עם AI' : 'Improve article with AI'}</button>
            <span id="ai-status-${i}" class="ai-status" aria-live="polite"></span>
          </div>

          <button class="btn-danger" onclick="deleteItem(${i})">${adminLang === 'he' ? 'מחק מאמר' : 'Delete article'}</button>
        `;
                list.appendChild(div);

                // ציור התצוגה המקדימה
                drawDropsAvatar(`skin-preview-${i}`, item.author || 'Steve');

                const toolbarOptions = [['bold', 'italic', 'underline'], [{ 'header': [2, 3, false] }], [{ 'list': 'ordered' }, { 'list': 'bullet' }], ['clean']];

                const quillHe = new Quill(`#editor-he-${i}`, { theme: 'snow', modules: { toolbar: toolbarOptions } });
                quillHe.root.innerHTML = item.content_he || '';

                const quillEn = new Quill(`#editor-en-${i}`, { theme: 'snow', modules: { toolbar: toolbarOptions } });
                quillEn.root.innerHTML = item.content_en || '';

                editors[i] = { he: quillHe, en: quillEn };
            });
        }


        async function improveArticle(i) {
            const button = document.querySelector('[onclick="improveArticle(' + i + ')"]');
            const status = document.getElementById('ai-status-' + i);

            if (!newsItems[i] || !editors[i]) return;

            if (button) {
                button.classList.add('ai-loading');
                button.disabled = true;
            }
            if (status) {
                status.className = 'ai-status';
                status.textContent = adminLang === 'he' ? 'משפר את המאמר...' : 'Improving article...';
            }

            const currentArticle = {
                title_he: newsItems[i].title_he || '',
                title_en: newsItems[i].title_en || '',
                text_he: newsItems[i].text_he || '',
                text_en: newsItems[i].text_en || '',
                content_he: editors[i].he.root.innerHTML || '',
                content_en: editors[i].en.root.innerHTML || ''
            };

            try {
                const res = await fetch('/api/improve-article', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },
                    body: JSON.stringify({ article: currentArticle })
                });

                const data = await res.json();

                if (!res.ok || !data.success || !data.article) {
                    throw new Error(data.message || (adminLang === 'he' ? 'שגיאת AI' : 'AI error'));
                }

                const improved = data.article;

                newsItems[i].title_he = improved.title_he;
                newsItems[i].title_en = improved.title_en;
                newsItems[i].text_he = improved.text_he;
                newsItems[i].text_en = improved.text_en;
                newsItems[i].content_he = improved.content_he;
                newsItems[i].content_en = improved.content_en;

                render();

                const nextStatus = document.getElementById('ai-status-' + i);
                if (nextStatus) {
                    nextStatus.className = 'ai-status success';
                    nextStatus.textContent = adminLang === 'he' ? '✓ המאמר שופר — בדוק אותו לפני השמירה' : '✓ Article improved — review it before saving';
                }
            } catch (error) {
                console.error(error);
                if (status) {
                    status.className = 'ai-status error';
                    status.textContent = '✕ ' + (error.message || (adminLang === 'he' ? 'לא ניתן לשפר כרגע' : 'Unable to improve right now'));
                }
            } finally {
                const activeButton = document.querySelector('[onclick="improveArticle(' + i + ')"]');
                if (activeButton) {
                    activeButton.classList.remove('ai-loading');
                    activeButton.disabled = false;
                }
            }
        }

        function updateItem(i, k, v) { newsItems[i][k] = v; }

        function updateAuthor(i, name) {
            newsItems[i].author = name;
            drawDropsAvatar(`skin-preview-${i}`, name);
        }

        function deleteItem(i) {
            newsItems.splice(i, 1);
            render();
        }

        function addNewsItem() {
            const id = 'post-' + Date.now();
            newsItems.push({ id, author: 'Steve', badge_he: 'עדכון', badge_en: 'UPDATE', title_he: '', title_en: '', text_he: '', text_en: '', content_he: '', content_en: '', url: `article.html?id=${id}` });
            render();
        }

        async function saveNewsToServer() {
            const status = document.getElementById('save-status');
            status.textContent = adminLang === 'he' ? 'שומר...' : 'Saving...';

            newsItems.forEach((item, i) => {
                item.content_he = editors[i].he.root.innerHTML;
                item.content_en = editors[i].en.root.innerHTML;
            });

            const res = await fetch('/api/save-news', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },
                body: JSON.stringify({ news: newsItems })
            });
            const data = await res.json();

            if (res.ok && data.success) {
                status.style.color = '#5fffe4';
                status.textContent = adminLang === 'he' ? '✓ המאמרים נשמרו בהצלחה!' : '✓ Articles saved successfully!';
            } else {
                status.style.color = '#ff6b8a';
                status.textContent = data.message || (adminLang === 'he' ? 'שגיאה בשמירה' : 'Save failed');
            }
        }
        applyAdminLanguage();
    </script>
  <script src="theme.js"></script>
  <script src="animations.js"></script>
  <script src="account-nav.js"></script>
</body>

</html>
